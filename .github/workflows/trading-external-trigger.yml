name: ETH Trading Monitor (External Trigger)

# 本 workflow 只接受外部触发，不使用 schedule
# 推荐使用 cron-job.org 或其他外部 cron 服务来触发
on:
  repository_dispatch:
    types: [trading-check]
  workflow_dispatch:  # 手动触发

env:
  TZ: UTC
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: trading-monitor-live
  cancel-in-progress: false

jobs:
  check-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      # 严格串行巡检（按权重优先级 BTC -> ETH -> SOL -> DOGE），彻底消除多币种同时开仓的 IMR/保证金 TOCTOU 竞态
      max-parallel: 1
      matrix:
        symbol: [BTC_USDT, ETH_USDT, SOL_USDT, DOGE_USDT]

    
    steps:
      - name: Checkpoint
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Download state
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SYM_LOWER=$(echo "${{ matrix.symbol }}" | tr '[:upper:]' '[:lower:]')
          echo "SYM_LOWER=${SYM_LOWER}" >> $GITHUB_ENV
          # 仅从本 workflow 最近完成且未被取消的 run 中定位状态 artifact，避免 ci.yml/report.yml 干扰
          DOWNLOADED=false
          CANDIDATE_RUNS=$(gh run list \
            --workflow trading-external-trigger.yml \
            --status completed \
            --limit 10 \
            --json databaseId,conclusion \
            --jq ".[] | select(.databaseId != ${GITHUB_RUN_ID} and (.conclusion == \"success\" or .conclusion == \"failure\")) | .databaseId" 2>/dev/null || true)
          for RUN_ID in $CANDIDATE_RUNS; do
            if gh run download "$RUN_ID" --name "trading-state-${{ matrix.symbol }}" --dir . 2>/dev/null; then
              echo "✅ Downloaded trading-state-${{ matrix.symbol }} from run ${RUN_ID}"
              DOWNLOADED=true
              break
            fi
          done
          if [ "$DOWNLOADED" = "false" ]; then
            echo "⚠️ No prior artifact found for trading-state-${{ matrix.symbol }}, initializing clean state"
            echo '{"trade_count":0,"consecutive_losses":0}' > trading_state_${SYM_LOWER}.json
          fi
          # 兼容历史大写状态文件名，统一规范为小写
          if [ -f "trading_state_${{ matrix.symbol }}.json" ] && [ ! -f "trading_state_${SYM_LOWER}.json" ]; then
            mv "trading_state_${{ matrix.symbol }}.json" "trading_state_${SYM_LOWER}.json"
          fi
          echo "📂 State files for ${{ matrix.symbol }}:"
          ls -la *state*.json *circuit_breaker*.json 2>/dev/null || true

      
      - name: Run trading check
        env:
          # API 凭证 (必需)
          GATE_API_KEY: ${{ secrets.GATE_API_KEY }}
          GATE_API_SECRET: ${{ secrets.GATE_API_SECRET }}
          ENABLE_AUTO_TRADING: ${{ secrets.ENABLE_AUTO_TRADING || vars.ENABLE_AUTO_TRADING }}
          
          # 交易对配置
          SYMBOL: ${{ matrix.symbol }}
          
          # Telegram 通知 (可选)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          
          # 风险管理配置 (优先从 GitHub secrets/vars 获取，其次使用卡片默认值)
          RISK_MODE: ${{ secrets.RISK_MODE || vars.RISK_MODE || 'fixed' }}
          RISK_FIXED_AMOUNT: ${{ secrets.RISK_FIXED_AMOUNT || vars.RISK_FIXED_AMOUNT || '5' }}
          RISK_PERCENT: ${{ secrets.RISK_PERCENT || vars.RISK_PERCENT || '0.008' }}
          APPLY_PORTFOLIO_WEIGHTS: ${{ secrets.APPLY_PORTFOLIO_WEIGHTS || vars.APPLY_PORTFOLIO_WEIGHTS || 'true' }}
          CIRCUIT_BREAKER_EQUITY: ${{ secrets.CIRCUIT_BREAKER_EQUITY || vars.CIRCUIT_BREAKER_EQUITY || '450' }}
          RESET_CIRCUIT_BREAKER: ${{ secrets.RESET_CIRCUIT_BREAKER || vars.RESET_CIRCUIT_BREAKER || 'false' }}
          LOCK_PROFIT_BUFFER: ${{ secrets.LOCK_PROFIT_BUFFER || vars.LOCK_PROFIT_BUFFER || '0.5' }}
          MAX_CONSECUTIVE_LOSSES: ${{ secrets.MAX_CONSECUTIVE_LOSSES || vars.MAX_CONSECUTIVE_LOSSES || '3' }}
          MIN_SL_DISTANCE_PCT: ${{ secrets.MIN_SL_DISTANCE_PCT || vars.MIN_SL_DISTANCE_PCT || '0.002' }}
          MAX_SINGLE_MARGIN_RATIO: ${{ secrets.MAX_SINGLE_MARGIN_RATIO || vars.MAX_SINGLE_MARGIN_RATIO || '0.30' }}
          MAX_TOTAL_MARGIN_RATIO: ${{ secrets.MAX_TOTAL_MARGIN_RATIO || vars.MAX_TOTAL_MARGIN_RATIO || '0.60' }}

          # 策略过滤与止盈配置 (对齐 V1 交易卡片)
          USE_ADX: ${{ secrets.USE_ADX || vars.USE_ADX || 'false' }}
          TP_RATIO: ${{ secrets.TP_RATIO || vars.TP_RATIO || '5.0' }}
          
          # 交易执行配置
          AUTO_SET_STOP_LOSS: ${{ secrets.AUTO_SET_STOP_LOSS || vars.AUTO_SET_STOP_LOSS || 'true' }}
          STOP_LOSS_MODE: ${{ secrets.STOP_LOSS_MODE || vars.STOP_LOSS_MODE || 'tight_only' }}
          CLOSE_MODE: ${{ secrets.CLOSE_MODE || vars.CLOSE_MODE || 'market' }}
          NOTIFY_DETAILS: ${{ secrets.NOTIFY_DETAILS || vars.NOTIFY_DETAILS || 'true' }}
          SIGNAL_NOTIFY_MODE: ${{ secrets.SIGNAL_NOTIFY_MODE || vars.SIGNAL_NOTIFY_MODE || 'operation' }}
          
          # 状态文件配置 (统一小写命名)
          STATE_FILE: trading_state_${{ env.SYM_LOWER }}.json
          
          # 调试配置
          GATE_DEBUG: ${{ secrets.GATE_DEBUG || vars.GATE_DEBUG || '0' }}
          DEBUG: ${{ secrets.DEBUG || vars.DEBUG || '0' }}
        run: python main.py
      
      - name: Upload state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-state-${{ matrix.symbol }}
          path: |
            trading_state_*.json
            trading_state.json
            position_state.json
            position_state_*.json
            cooldown_state.json
            cooldown_state_*.json
            cooldown_notify_state.json
            cooldown_notify_state_*.json
            circuit_breaker_lock.json
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true
